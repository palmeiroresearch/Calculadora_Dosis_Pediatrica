<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Dosis Pediátricas v2.0</title>
    <meta name="theme-color" content="#2c3e50">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .content {
            padding: 30px 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .search-input {
            position: relative;
        }

        .drug-list {
            position: absolute;
            top: calc(100% - 2px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .drug-list.show {
            display: block;
        }

        .drug-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f1f1f1;
            transition: all 0.2s ease;
        }

        .drug-item:hover {
            background: #f8f9ff;
            color: #667eea;
            padding-left: 20px;
        }

        .drug-info {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .drug-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .dose-info {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .dose-info strong {
            color: #2c3e50;
        }

        .special-dosing {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .special-dosing h4 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .dose-option {
            display: flex;
            align-items: center;
            margin: 8px 0;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .dose-option:hover {
            background: rgba(255,193,7,0.2);
        }

        .dose-option input[type="radio"] {
            margin-right: 10px;
        }

        .presentations {
            margin-top: 15px;
        }

        .presentations h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .calculation-result {
            background: #e8f5e8;
            border: 2px solid #4caf50;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .calculation-result h3 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .dose-range {
            font-size: 20px;
            font-weight: bold;
            color: #1b5e20;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .calc-details {
            font-size: 14px;
            color: #2e7d32;
            background: rgba(255,255,255,0.7);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .presentation-calc {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .presentation-calc h4 {
            color: #1565c0;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .dilution-section {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .dilution-section h4 {
            color: #6a1b9a;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .dilution-options {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .dilution-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #9c27b0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .dilution-btn:hover {
            background: #f3e5f5;
        }

        .dilution-btn.active {
            background: #9c27b0;
            color: white;
        }

        .alert-box {
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }

        .alert-danger {
            background: #f8d7da;
            border: 1px solid #f44336;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            border: 1px solid #17a2b8;
            color: #0c5460;
        }

        .loading-message {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 500;
        }

        .error-message {
            background: #fee;
            border: 2px solid #f44336;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .input-row {
                grid-template-columns: 1fr;
            }

            .dilution-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💊 Calculadora Dosis Pediátricas v2.0</h1>
            <p>Sistema avanzado con cálculo de diluciones y presentaciones</p>
        </div>

        <div class="content">
            <div id="loadingMessage" class="loading-message">
                Cargando base de datos de medicamentos...
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            
            <div id="mainContent" style="display: none;">
                <div class="input-row">
                    <div class="input-group">
                        <label for="weight">Peso (kg) *</label>
                        <input type="number" id="weight" placeholder="Ej: 15" step="0.1" min="0.1">
                    </div>

                    <div class="input-group">
                        <label for="age">Edad (meses) - opcional</label>
                        <input type="number" id="age" placeholder="Ej: 24" min="0">
                    </div>
                </div>

                <div class="input-group">
                    <label for="drugSearch">Buscar medicamento *</label>
                    <div class="search-input">
                        <input type="text" id="drugSearch" placeholder="Escriba el nombre del medicamento" autocomplete="off">
                        <div class="drug-list" id="drugList"></div>
                    </div>
                </div>

                <div id="specialDosingSection"></div>

                <div class="input-group" id="presentationGroup" style="display: none;">
                    <label for="presentationSelect">Seleccionar presentación</label>
                    <select id="presentationSelect">
                        <option value="">-- Seleccione una presentación --</option>
                    </select>
                </div>

                <div class="drug-info" id="drugInfo"></div>
                <div class="calculation-result" id="calculationResult"></div>
            </div>
        </div>
    </div>

    <script>
        let medications = {};
        let selectedDrug = null;
        let selectedDoseOption = null;
        let selectedPresentation = null;
        let selectedDilution = null; // Cambiado a null, se asigna dinámicamente

        const weightInput = document.getElementById('weight');
        const ageInput = document.getElementById('age');
        const drugSearch = document.getElementById('drugSearch');
        const drugList = document.getElementById('drugList');
        const drugInfo = document.getElementById('drugInfo');
        const calculationResult = document.getElementById('calculationResult');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');
        const mainContent = document.getElementById('mainContent');
        const specialDosingSection = document.getElementById('specialDosingSection');
        const presentationGroup = document.getElementById('presentationGroup');
        const presentationSelect = document.getElementById('presentationSelect');

        // Cargar medicamentos desde el JSON actualizado
        async function loadMedications() {
            try {
                const response = await fetch('medications.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                medications = await response.json();
                console.log('✅ Base de datos cargada:', Object.keys(medications).length, 'medicamentos');
                console.log('📋 Medicamentos disponibles:', Object.keys(medications));
                
                loadingMessage.style.display = 'none';
                mainContent.style.display = 'block';
                
            } catch (error) {
                console.error('❌ Error al cargar medicamentos:', error);
                loadingMessage.style.display = 'none';
                errorMessage.innerHTML = `
                    <strong>⚠️ Error al cargar la base de datos</strong><br>
                    ${error.message}<br>
                    <small>Asegúrese de que el archivo medications.json esté en la misma carpeta y que esté usando un servidor web (no file://)</small>
                `;
                errorMessage.style.display = 'block';
            }
        }

        // Event listeners
        weightInput.addEventListener('input', calculateDose);
        ageInput.addEventListener('input', calculateDose);
        drugSearch.addEventListener('input', searchDrugs);
        presentationSelect.addEventListener('change', handlePresentationChange);

        drugSearch.addEventListener('focus', () => {
            if (drugSearch.value.trim() !== '') {
                searchDrugs();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-input')) {
                drugList.classList.remove('show');
            }
        });

        function searchDrugs() {
            const query = drugSearch.value.toLowerCase().trim();
            
            if (query === '') {
                drugList.classList.remove('show');
                return;
            }

            const results = Object.keys(medications).filter(key => 
                key.includes(query) || 
                medications[key].name.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                drugList.innerHTML = '<div class="drug-item" style="color: #999; cursor: default;">No se encontraron medicamentos</div>';
                drugList.classList.add('show');
                return;
            }

            drugList.innerHTML = results.map(key => 
                `<div class="drug-item" onclick="selectDrug('${key}')">${medications[key].name}</div>`
            ).join('');
            
            drugList.classList.add('show');
        }

        function selectDrug(drugKey) {
            selectedDrug = medications[drugKey];
            selectedDoseOption = null;
            selectedPresentation = null;
            drugSearch.value = selectedDrug.name;
            drugList.classList.remove('show');
            
            displayDrugInfo();
            displaySpecialDosing();
            displayPresentations();
            calculateDose();
        }

        function displayDrugInfo() {
            if (!selectedDrug) return;

            let infoHTML = `
                <h3>${selectedDrug.name}</h3>
                <div class="dose-info">
                    <strong>Dosis:</strong> ${selectedDrug.dose}<br>
                    ${selectedDrug.maxDaily ? `<strong>Dosis máxima diaria:</strong> ${selectedDrug.maxDaily}<br>` : ''}
                    ${selectedDrug.interval ? `<strong>Intervalo:</strong> ${selectedDrug.interval}` : ''}
                </div>
            `;

            if (selectedDrug.notes) {
                infoHTML += `<div class="alert-box alert-info">📝 ${selectedDrug.notes}</div>`;
            }

            drugInfo.innerHTML = infoHTML;
            drugInfo.style.display = 'block';
        }

        function displaySpecialDosing() {
            if (!selectedDrug || !selectedDrug.specialDosing || !selectedDrug.specialDosing.hasMultipleDoses) {
                specialDosingSection.innerHTML = '';
                specialDosingSection.style.display = 'none';
                return;
            }

            let optionsHTML = '<div class="special-dosing"><h4>⚕️ Seleccione la indicación clínica:</h4>';
            
            selectedDrug.specialDosing.options.forEach((opt, idx) => {
                optionsHTML += `
                    <label class="dose-option">
                        <input type="radio" name="doseOption" value="${idx}" onchange="selectDoseOption(${idx})">
                        <span><strong>${opt.indication}:</strong> ${opt.minDose}${opt.maxDose && opt.maxDose !== opt.minDose ? '-'+opt.maxDose : ''} ${selectedDrug.unit}/kg/día</span>
                    </label>
                `;
            });
            
            optionsHTML += '</div>';
            specialDosingSection.innerHTML = optionsHTML;
            specialDosingSection.style.display = 'block';
        }

        function selectDoseOption(index) {
            selectedDoseOption = selectedDrug.specialDosing.options[index];
            calculateDose();
        }

        function displayPresentations() {
            if (!selectedDrug || !selectedDrug.presentations || selectedDrug.presentations.length === 0) {
                presentationGroup.style.display = 'none';
                return;
            }

            presentationSelect.innerHTML = '<option value="">-- Seleccione una presentación --</option>';
            
            selectedDrug.presentations.forEach((pres, idx) => {
                presentationSelect.innerHTML += `<option value="${idx}">${pres.description}</option>`;
            });

            presentationGroup.style.display = 'block';
        }

        function handlePresentationChange() {
            const idx = presentationSelect.value;
            if (idx === '') {
                selectedPresentation = null;
            } else {
                selectedPresentation = selectedDrug.presentations[parseInt(idx)];
            }
            calculateDose();
        }

        function calculateDose() {
            const weight = parseFloat(weightInput.value);
            const age = parseFloat(ageInput.value);
            
            if (!weight || !selectedDrug || weight <= 0) {
                calculationResult.style.display = 'none';
                return;
            }

            // Determinar dosis a usar
            let minDose = selectedDrug.minDose;
            let maxDose = selectedDrug.maxDose;

            if (selectedDoseOption) {
                minDose = selectedDoseOption.minDose;
                maxDose = selectedDoseOption.maxDose;
            }

            const unit = selectedDrug.unit;
            const minTotal = minDose * weight;
            const maxTotal = maxDose * weight;

            // Verificar restricciones de edad
            let alerts = '';
            if (age && selectedDrug.ageRestrictions) {
                if (selectedDrug.ageRestrictions.minMonths && age < selectedDrug.ageRestrictions.minMonths) {
                    alerts += `<div class="alert-box alert-danger">⛔ ${selectedDrug.ageRestrictions.warning}</div>`;
                }
                if (selectedDrug.ageRestrictions.timeRestriction) {
                    alerts += `<div class="alert-box alert-warning">⏱️ ${selectedDrug.ageRestrictions.warning}</div>`;
                }
            }

            // Verificar dosis máximas
            if (selectedDrug.maxDailyValue) {
                const maxAllowed = selectedDrug.maxDailyValue * weight;
                if (maxTotal > maxAllowed) {
                    alerts += `<div class="alert-box alert-warning">⚠️ Dosis calculada excede el máximo diario de ${selectedDrug.maxDaily}</div>`;
                }
            }

            if (selectedDrug.maxSingleDose && maxTotal > selectedDrug.maxSingleDose) {
                alerts += `<div class="alert-box alert-danger">⚠️ Dosis máxima por aplicación: ${selectedDrug.maxSingleDose} ${unit}</div>`;
            }

            // Construir resultado
            let resultHTML = `<h3>📊 Resultados para ${weight} kg${age ? ` (${age} meses)` : ''}</h3>`;
            
            resultHTML += alerts;

            // Dosis calculada
            if (minDose === maxDose) {
                resultHTML += `<div class="dose-range">${minTotal.toFixed(1)} ${unit}</div>`;
            } else {
                resultHTML += `<div class="dose-range">${minTotal.toFixed(1)} - ${maxTotal.toFixed(1)} ${unit}</div>`;
            }

            // Detalles del cálculo
            let calcDetails = '<div class="calc-details">';
            if (selectedDrug.intervalHours) {
                const dosesPerDay = 24 / selectedDrug.intervalHours;
                const minPerDose = minTotal / dosesPerDay;
                const maxPerDose = maxTotal / dosesPerDay;
                
                calcDetails += `<strong>Dosis diaria total:</strong> ${minTotal.toFixed(1)}${minDose !== maxDose ? '-'+maxTotal.toFixed(1) : ''} ${unit}/día<br>`;
                calcDetails += `<strong>Por dosis (${selectedDrug.interval}):</strong> ${minPerDose.toFixed(1)}${minDose !== maxDose ? '-'+maxPerDose.toFixed(1) : ''} ${unit}<br>`;
            } else {
                calcDetails += `<strong>Dosis calculada:</strong> ${minTotal.toFixed(1)}${minDose !== maxDose ? '-'+maxTotal.toFixed(1) : ''} ${unit}<br>`;
            }
            calcDetails += `<strong>Cálculo:</strong> ${minDose}${minDose !== maxDose ? '-'+maxDose : ''} ${unit}/kg × ${weight} kg`;
            calcDetails += '</div>';
            resultHTML += calcDetails;

            // Cálculo de presentación
            if (selectedPresentation) {
                resultHTML += calculatePresentation(minTotal, maxTotal, minDose === maxDose);
            }

            calculationResult.innerHTML = resultHTML;
            calculationResult.style.display = 'block';
        }

        function calculatePresentation(minDose, maxDose, isSingleDose) {
            const pres = selectedPresentation;
            let html = '';

            if (pres.type === 'liquid') {
                const minMl = (minDose / pres.concentration) * pres.volume;
                const maxMl = (maxDose / pres.concentration) * pres.volume;
                
                html += `<div class="presentation-calc">`;
                html += `<h4>💧 Con ${pres.description}:</h4>`;
                if (isSingleDose) {
                    html += `<strong>Administrar:</strong> ${minMl.toFixed(1)} ml`;
                } else {
                    html += `<strong>Administrar:</strong> ${minMl.toFixed(1)} - ${maxMl.toFixed(1)} ml`;
                }
                
                if (selectedDrug.intervalHours) {
                    const dosesPerDay = 24 / selectedDrug.intervalHours;
                    const minMlPerDose = minMl / dosesPerDay;
                    const maxMlPerDose = maxMl / dosesPerDay;
                    html += `<br><strong>Por dosis:</strong> ${minMlPerDose.toFixed(1)}${!isSingleDose ? '-'+maxMlPerDose.toFixed(1) : ''} ml cada ${selectedDrug.intervalHours}h`;
                }
                html += `</div>`;
            }

            if (pres.type === 'iv' && !pres.volume) {
                html += generateDilutionCalculator(minDose, maxDose, isSingleDose);
            }

            return html;
        }

        function generateDilutionCalculator(minDose, maxDose, isSingleDose) {
            const pres = selectedPresentation;
            
            // Verificar si tiene opciones de dilución configuradas
            if (!pres.dilutionOptions || pres.dilutionOptions.length === 0) {
                return ''; // No mostrar calculadora si no hay opciones
            }

            let html = '<div class="dilution-section">';
            html += '<h4>🧪 Calculadora de Dilución IV</h4>';
            html += '<p style="margin-bottom: 10px;">Seleccione volumen de dilución:</p>';
            html += '<div class="dilution-options">';
            
            // Generar botones dinámicamente desde el JSON
            pres.dilutionOptions.forEach(vol => {
                html += `<button class="dilution-btn ${selectedDilution === vol ? 'active' : ''}" onclick="setDilution(${vol})">${vol} ml</button>`;
            });
            
            html += '</div>';

            // Si no hay dilución seleccionada, usar la primera opción por defecto
            if (!selectedDilution || !pres.dilutionOptions.includes(selectedDilution)) {
                selectedDilution = pres.dilutionOptions[0];
            }

            const concentration = pres.concentration / selectedDilution;
            const minMl = minDose / concentration;
            const maxMl = maxDose / concentration;

            html += `<div style="margin-top: 12px; padding: 10px; background: white; border-radius: 6px;">`;
            html += `<strong>Concentración final:</strong> ${concentration.toFixed(1)} ${pres.concentrationUnit}/ml<br>`;
            html += `<strong>Volumen a administrar:</strong> ${minMl.toFixed(1)}${!isSingleDose ? '-'+maxMl.toFixed(1) : ''} ml`;
            html += `</div>`;
            html += '</div>';

            return html;
        }

        function setDilution(ml) {
            selectedDilution = ml;
            calculateDose();
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', loadMedications);
    </script>
</body>
</html>
